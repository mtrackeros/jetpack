<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="290" aria-label="The first read of the widget type registry after init latches, fires the registration action once, the package registers its manifest at priority 10 and a plugin registers its own manifest at priority 20, and register() refuses unnamespaced and duplicate names." role="img" viewBox="0 0 1160 290"><style>text{font:12px ui-sans-serif,system-ui,-apple-system,&quot;Segoe UI&quot;,sans-serif;fill:#1f2328}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px}.title{font-weight:600}.muted{fill:#57606a}.box{fill:#fff;stroke:#1f2328;stroke-width:1.2}.box-accent{fill:#ddf4ff;stroke:#0969da;stroke-width:1.4}.edge{stroke:#1f2328;stroke-width:1.3;fill:none}.edge-dashed{stroke-dasharray:5 4}.arrowhead{fill:#1f2328}@media (prefers-color-scheme:dark){text{fill:#e6edf3}.muted{fill:#8b949e}.box{fill:#0d1117;stroke:#e6edf3}.box-accent{fill:#0c2d6b;stroke:#58a6ff}.edge{stroke:#e6edf3}.arrowhead{fill:#e6edf3}}</style><defs><marker id="arrow" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M 0 0 L 10 5 L 0 10 z" class="arrowhead"/></marker></defs><rect width="180" height="84" x="20" y="100" class="box" rx="4"/><text x="110" y="130" class="title" text-anchor="middle">first read</text><text x="110" y="146" class="mono" text-anchor="middle">get_registered()</text><text x="110" y="162" class="mono" text-anchor="middle">get_all_registered()</text><rect width="150" height="84" x="225" y="100" class="box" rx="4"/><text x="300" y="122" class="title" text-anchor="middle">ensure_hydrated()</text><text x="300" y="138" class="muted" text-anchor="middle">after init only</text><text x="300" y="154" class="muted" text-anchor="middle">latch, then fire:</text><text x="300" y="170" class="muted" text-anchor="middle">no re-entry</text><rect width="210" height="84" x="400" y="100" class="box-accent" rx="4"/><text x="505" y="122" class="title" text-anchor="middle">do_action(</text><text x="505" y="138" class="mono" text-anchor="middle">jetpack_premium_analytics_</text><text x="505" y="154" class="mono" text-anchor="middle">register_widget_types,</text><text x="505" y="170" class="mono" text-anchor="middle">$registry )</text><rect width="290" height="64" x="640" y="30" class="box" rx="4"/><text x="785" y="50" class="title" text-anchor="middle">priority 10, the package</text><text x="785" y="66" class="mono" text-anchor="middle">register_widget_types( $registry )</text><text x="785" y="82" class="muted" text-anchor="middle">build/widgets.php, filtered, translated</text><rect width="290" height="80" x="640" y="140" class="box" rx="4"/><text x="785" y="168" class="title" text-anchor="middle">priority 20, a plugin</text><text x="785" y="184" class="mono" text-anchor="middle">register_widget_types_from_manifest( … )</text><text x="785" y="200" class="muted" text-anchor="middle">its own build manifest, same pipeline</text><rect width="200" height="100" x="950" y="100" class="box" rx="4"/><text x="1050" y="130" class="title" text-anchor="middle">register()</text><text x="1050" y="146" class="muted" text-anchor="middle">name is namespace/name</text><text x="1050" y="162" class="muted" text-anchor="middle">name not registered</text><text x="1050" y="178" class="muted" text-anchor="middle">else _doing_it_wrong(), false</text><polyline marker-end="url(#arrow)" points="200 142 225 142" class="edge"/><polyline marker-end="url(#arrow)" points="375 142 400 142" class="edge"/><polyline marker-end="url(#arrow)" points="610 130 640 62" class="edge"/><polyline marker-end="url(#arrow)" points="610 155 640 180" class="edge"/><polyline marker-end="url(#arrow)" points="930 62 950 130" class="edge"/><polyline marker-end="url(#arrow)" points="930 180 950 160" class="edge"/><polyline marker-end="url(#arrow)" points="1050 200 1050 260 110 260 110 184" class="edge edge-dashed"/><text x="570" y="255" class="muted" text-anchor="middle">the read then answers from the populated registry</text></svg>