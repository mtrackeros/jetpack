<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="538" aria-label="A section registration calls get_dashboard_default_layout_for() with its id; the filter starts from an empty array, the package seeds the bundled layout of the resolved section at priority 10, a plugin appends instances, and unsupported widget types are dropped after the filter before the layout reaches the client." role="img" viewBox="0 0 1000 538"><style>text{font:12px ui-sans-serif,system-ui,-apple-system,&quot;Segoe UI&quot;,sans-serif;fill:#1f2328}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px}.title{font-weight:600}.muted{fill:#57606a}.box{fill:#fff;stroke:#1f2328;stroke-width:1.2}.box-accent{fill:#ddf4ff;stroke:#0969da;stroke-width:1.4}.edge{stroke:#1f2328;stroke-width:1.3;fill:none}.arrowhead{fill:#1f2328}@media (prefers-color-scheme:dark){text{fill:#e6edf3}.muted{fill:#8b949e}.box{fill:#0d1117;stroke:#e6edf3}.box-accent{fill:#0c2d6b;stroke:#58a6ff}.edge{stroke:#e6edf3}.arrowhead{fill:#e6edf3}}</style><defs><marker id="arrow" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M 0 0 L 10 5 L 0 10 z" class="arrowhead"/></marker></defs><rect width="190" height="70" x="20" y="30" class="box" rx="4"/><text x="115" y="53" class="title" text-anchor="middle">registration</text><text x="115" y="69" class="mono" text-anchor="middle">&apos;default_layout&apos; =&gt; fn()</text><text x="115" y="85" class="muted" text-anchor="middle">calls the resolver</text><rect width="270" height="70" x="240" y="30" class="box" rx="4"/><text x="375" y="53" class="title" text-anchor="middle">get_dashboard_default_layout_for(</text><text x="375" y="69" class="mono" text-anchor="middle">$alias )</text><text x="375" y="85" class="muted" text-anchor="middle">DASHBOARD_NAME, a slug or an id</text><rect width="240" height="70" x="540" y="30" class="box-accent" rx="4"/><text x="660" y="53" class="title" text-anchor="middle">apply_filters(</text><text x="660" y="69" class="mono" text-anchor="middle">…dashboard_default_layout,</text><text x="660" y="85" class="mono" text-anchor="middle">array(), $alias )</text><polyline marker-end="url(#arrow)" points="210 65 240 65" class="edge"/><polyline marker-end="url(#arrow)" points="510 65 540 65" class="edge"/><rect width="240" height="64" x="540" y="140" class="box" rx="4"/><text x="660" y="160" class="title" text-anchor="middle">priority 10, the package</text><text x="660" y="176" class="mono" text-anchor="middle">seed_default_dashboard_layout()</text><text x="660" y="192" class="muted" text-anchor="middle">appends the bundled map&apos;s section</text><polyline marker-end="url(#arrow)" points="660 100 660 140" class="edge"/><rect width="240" height="64" x="540" y="244" class="box" rx="4"/><text x="660" y="264" class="title" text-anchor="middle">any priority, a plugin</text><text x="660" y="280" class="muted" text-anchor="middle">appends an instance</text><text x="660" y="296" class="muted" text-anchor="middle">switching on $alias</text><polyline marker-end="url(#arrow)" points="660 204 660 244" class="edge"/><text x="672" y="228" class="muted" text-anchor="start">then</text><rect width="240" height="64" x="540" y="348" class="box" rx="4"/><text x="660" y="368" class="title" text-anchor="middle">after the filter</text><text x="660" y="384" class="mono" text-anchor="middle">remove_unsupported_widget_items()</text><text x="660" y="400" class="muted" text-anchor="middle">drops types the site cannot serve</text><polyline marker-end="url(#arrow)" points="660 308 660 348" class="edge"/><polyline marker-end="url(#arrow)" points="660 412 660 452" class="edge"/><rect width="960" height="66" x="20" y="452" class="box" rx="4"/><text x="500" y="473" class="title" text-anchor="middle">client: useDashboardSectionLayout()</text><text x="500" y="489" class="muted" text-anchor="middle">renders preferences[slug] when the reader saved a layout, otherwise the section&apos;s default_layout from to_array();</text><text x="500" y="505" class="muted" text-anchor="middle">Reset deletes the stored entry, so the section follows the default again</text></svg>