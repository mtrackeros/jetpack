<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="538" aria-label="A section declares its default layout; get_default_layout() runs it through the default-layout filter, where a plugin adds instances at priority 10 and the package removes unsupported widget types at priority 100, before it reaches the client as the fallback for the stored layout." role="img" viewBox="0 0 1000 538"><style>text{font:12px ui-sans-serif,system-ui,-apple-system,&quot;Segoe UI&quot;,sans-serif;fill:#1f2328}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px}.title{font-weight:600}.muted{fill:#57606a}.box{fill:#fff;stroke:#1f2328;stroke-width:1.2}.box-accent{fill:#ddf4ff;stroke:#0969da;stroke-width:1.4}.edge{stroke:#1f2328;stroke-width:1.3;fill:none}.arrowhead{fill:#1f2328}@media (prefers-color-scheme:dark){text{fill:#e6edf3}.muted{fill:#8b949e}.box{fill:#0d1117;stroke:#e6edf3}.box-accent{fill:#0c2d6b;stroke:#58a6ff}.edge{stroke:#e6edf3}.arrowhead{fill:#e6edf3}}</style><defs><marker id="arrow" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M 0 0 L 10 5 L 0 10 z" class="arrowhead"/></marker></defs><rect width="200" height="70" x="20" y="30" class="box" rx="4"/><text x="120" y="53" class="title" text-anchor="middle">registration</text><text x="120" y="69" class="mono" text-anchor="middle">&apos;default_layout&apos; =&gt;</text><text x="120" y="85" class="muted" text-anchor="middle">array | callable</text><rect width="220" height="70" x="250" y="30" class="box" rx="4"/><text x="360" y="53" class="title" text-anchor="middle">Dashboard_Section::</text><text x="360" y="69" class="mono" text-anchor="middle">get_default_layout()</text><text x="360" y="85" class="muted" text-anchor="middle">the declared instances</text><rect width="260" height="70" x="500" y="30" class="box-accent" rx="4"/><text x="630" y="53" class="title" text-anchor="middle">apply_filters(</text><text x="630" y="69" class="mono" text-anchor="middle">…dashboard_default_layout,</text><text x="630" y="85" class="mono" text-anchor="middle">$layout, $id, $section )</text><polyline marker-end="url(#arrow)" points="220 65 250 65" class="edge"/><polyline marker-end="url(#arrow)" points="470 65 500 65" class="edge"/><rect width="260" height="64" x="500" y="140" class="box" rx="4"/><text x="630" y="160" class="title" text-anchor="middle">priority 10, a plugin</text><text x="630" y="176" class="muted" text-anchor="middle">adds an instance</text><text x="630" y="192" class="muted" text-anchor="middle">for one $section_id</text><polyline marker-end="url(#arrow)" points="630 100 630 140" class="edge"/><rect width="260" height="64" x="500" y="244" class="box" rx="4"/><text x="630" y="264" class="title" text-anchor="middle">priority 100, the package</text><text x="630" y="280" class="mono" text-anchor="middle">remove_unsupported_</text><text x="630" y="296" class="mono" text-anchor="middle">default_layout_items()</text><polyline marker-end="url(#arrow)" points="630 204 630 244" class="edge"/><text x="642" y="228" class="muted" text-anchor="start">then</text><rect width="260" height="64" x="500" y="348" class="box" rx="4"/><text x="630" y="368" class="title" text-anchor="middle">to_array()</text><text x="630" y="384" class="mono" text-anchor="middle">default_layout</text><text x="630" y="400" class="muted" text-anchor="middle">to the client</text><polyline marker-end="url(#arrow)" points="630 308 630 348" class="edge"/><polyline marker-end="url(#arrow)" points="630 412 630 452" class="edge"/><rect width="960" height="66" x="20" y="452" class="box" rx="4"/><text x="500" y="473" class="title" text-anchor="middle">client: useDashboardSectionLayout()</text><text x="500" y="489" class="muted" text-anchor="middle">renders preferences[slug] when the reader saved a layout, otherwise the section&apos;s default_layout from to_array();</text><text x="500" y="505" class="muted" text-anchor="middle">Reset deletes the stored entry, so the section follows the default again</text></svg>