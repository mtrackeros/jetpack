<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="450" aria-label="The registry is filtered by availability and serialized by the sections REST route; the client reads it as the dashboardSection core-data entity and builds the navigation from it, while a slug list in the inline script data lets report routes redirect before any request." role="img" viewBox="0 0 1120 450"><style>text{font:12px ui-sans-serif,system-ui,-apple-system,&quot;Segoe UI&quot;,sans-serif;fill:#1f2328}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px}.title{font-weight:600}.muted{fill:#57606a}.box{fill:#fff;stroke:#1f2328;stroke-width:1.2}.box-accent{fill:#ddf4ff;stroke:#0969da;stroke-width:1.4}.lane{fill:#f6f8fa;stroke:#d0d7de;stroke-width:1}.edge{stroke:#1f2328;stroke-width:1.3;fill:none}.edge-dashed{stroke-dasharray:5 4}.arrowhead{fill:#1f2328}@media (prefers-color-scheme:dark){text{fill:#e6edf3}.muted{fill:#8b949e}.box{fill:#0d1117;stroke:#e6edf3}.box-accent{fill:#0c2d6b;stroke:#58a6ff}.lane{fill:#161b22;stroke:#30363d}.edge{stroke:#e6edf3}.arrowhead{fill:#e6edf3}}</style><defs><marker id="arrow" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M 0 0 L 10 5 L 0 10 z" class="arrowhead"/></marker></defs><rect width="1090" height="190" x="15" y="20" class="lane" rx="6"/><text x="25" y="42" class="title" text-anchor="start">Server (PHP)</text><rect width="1090" height="185" x="15" y="250" class="lane" rx="6"/><text x="25" y="272" class="title" text-anchor="start">Client (SPA)</text><rect width="190" height="90" x="30" y="70" class="box" rx="4"/><text x="125" y="103" class="title" text-anchor="middle">Dashboard_Section_Registry</text><text x="125" y="119" class="muted" text-anchor="middle">every registered</text><text x="125" y="135" class="muted" text-anchor="middle">section</text><rect width="250" height="90" x="245" y="70" class="box" rx="4"/><text x="370" y="95" class="title" text-anchor="middle">get_available_dashboard_sections()</text><text x="370" y="111" class="muted" text-anchor="middle">preview scope, then</text><text x="370" y="127" class="muted" text-anchor="middle">the section&apos;s own is_available(),</text><text x="370" y="143" class="muted" text-anchor="middle">sorted by order</text><rect width="220" height="90" x="520" y="70" class="box" rx="4"/><text x="630" y="95" class="title" text-anchor="middle">to_array()</text><text x="630" y="111" class="muted" text-anchor="middle">id, slug, label, title, order</text><text x="630" y="127" class="muted" text-anchor="middle">date_filter, date_filter_options</text><text x="630" y="143" class="muted" text-anchor="middle">requires_sync, default_layout</text><rect width="150" height="90" x="765" y="70" class="box-accent" rx="4"/><text x="840" y="95" class="title" text-anchor="middle">REST route</text><text x="840" y="111" class="mono" text-anchor="middle">GET /wpcom/v2/</text><text x="840" y="127" class="mono" text-anchor="middle">dashboards/{name}/</text><text x="840" y="143" class="mono" text-anchor="middle">sections</text><rect width="150" height="90" x="940" y="70" class="box" rx="4"/><text x="1015" y="95" class="title" text-anchor="middle">script data</text><text x="1015" y="111" class="mono" text-anchor="middle">preview_sections</text><text x="1015" y="127" class="muted" text-anchor="middle">slugs only, inline</text><text x="1015" y="143" class="muted" text-anchor="middle">JetpackScriptData</text><polyline marker-end="url(#arrow)" points="220 115 245 115" class="edge"/><polyline marker-end="url(#arrow)" points="495 115 520 115" class="edge"/><polyline marker-end="url(#arrow)" points="740 115 765 115" class="edge"/><polyline marker-end="url(#arrow)" points="370 70 370 50 1015 50 1015 70" class="edge"/><text x="700" y="45" class="muted" text-anchor="middle">slugs of the same sections</text><rect width="250" height="100" x="245" y="290" class="box" rx="4"/><text x="370" y="320" class="title" text-anchor="middle">core-data entity dashboardSection</text><text x="370" y="336" class="muted" text-anchor="middle">registered by the init module</text><text x="370" y="352" class="muted" text-anchor="middle">key: slug</text><text x="370" y="368" class="muted" text-anchor="middle">baseURL: the route above</text><rect width="220" height="100" x="520" y="290" class="box" rx="4"/><text x="630" y="312" class="title" text-anchor="middle">useDashboardSections()</text><text x="630" y="328" class="mono" text-anchor="middle">useEntityRecords( &apos;root&apos;,</text><text x="630" y="344" class="mono" text-anchor="middle">&apos;dashboardSection&apos;,</text><text x="630" y="360" class="mono" text-anchor="middle">{ per_page: -1 } )</text><text x="630" y="376" class="muted" text-anchor="middle">sections + hasResolved</text><rect width="150" height="100" x="765" y="290" class="box" rx="4"/><text x="840" y="320" class="title" text-anchor="middle">stage.tsx</text><text x="840" y="336" class="muted" text-anchor="middle">navigation: slug, label</text><text x="840" y="352" class="muted" text-anchor="middle">?section= deep link</text><text x="840" y="368" class="muted" text-anchor="middle">default_layout fallback</text><rect width="150" height="100" x="940" y="290" class="box" rx="4"/><text x="1015" y="320" class="title" text-anchor="middle">report routes</text><text x="1015" y="336" class="mono" text-anchor="middle">isDashboardSection</text><text x="1015" y="352" class="mono" text-anchor="middle">InPreviewScope()</text><text x="1015" y="368" class="muted" text-anchor="middle">redirect if hidden</text><line x1="15" x2="1105" y1="230" y2="230" class="edge edge-dashed"/><text x="25" y="226" class="muted" text-anchor="start">HTTP</text><polyline marker-end="url(#arrow)" points="840 160 840 230 370 230 370 290" class="edge"/><text x="605" y="245" class="muted" text-anchor="middle">JSON array, one object per available section</text><polyline marker-end="url(#arrow)" points="495 340 520 340" class="edge"/><polyline marker-end="url(#arrow)" points="740 340 765 340" class="edge"/><polyline marker-end="url(#arrow)" points="1015 160 1015 290" class="edge edge-dashed"/><text x="1045" y="245" class="muted" text-anchor="middle">inline</text></svg>