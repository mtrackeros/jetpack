<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" aria-label="The package registers its five sections from bootstrap_dashboard_sections() at file scope, on init or at once when init has run; register() refuses an invalid dashboard name, an unnamespaced id and a duplicate id; a plugin calls register_dashboard_section() once the API file is loaded." role="img" viewBox="0 0 1000 300"><style>text{font:12px ui-sans-serif,system-ui,-apple-system,&quot;Segoe UI&quot;,sans-serif;fill:#1f2328}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px}.title{font-weight:600}.muted{fill:#57606a}.box,.box-muted{fill:#fff;stroke:#1f2328;stroke-width:1.2}.box-muted{fill:#f6f8fa;stroke:#8c959f;stroke-dasharray:4 3}.edge{stroke:#1f2328;stroke-width:1.3;fill:none}.arrowhead{fill:#1f2328}@media (prefers-color-scheme:dark){text{fill:#e6edf3}.muted{fill:#8b949e}.box{fill:#0d1117;stroke:#e6edf3}.box-muted{fill:#161b22;stroke:#6e7681}.edge{stroke:#e6edf3}.arrowhead{fill:#e6edf3}}</style><defs><marker id="arrow" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M 0 0 L 10 5 L 0 10 z" class="arrowhead"/></marker></defs><rect width="200" height="84" x="20" y="100" class="box" rx="4"/><text x="120" y="130" class="title" text-anchor="middle">default-dashboard-sections.php</text><text x="120" y="146" class="muted" text-anchor="middle">loaded by both entry points</text><text x="120" y="162" class="muted" text-anchor="middle">(see the loading paths)</text><rect width="230" height="84" x="250" y="100" class="box" rx="4"/><text x="365" y="130" class="title" text-anchor="middle">bootstrap_dashboard_sections()</text><text x="365" y="146" class="muted" text-anchor="middle">did init run? register now</text><text x="365" y="162" class="muted" text-anchor="middle">otherwise add_action( &apos;init&apos;, … )</text><rect width="240" height="84" x="510" y="100" class="box" rx="4"/><text x="630" y="130" class="title" text-anchor="middle">register_default_dashboard_sections()</text><text x="630" y="146" class="muted" text-anchor="middle">Traffic, Insights, Subscribers, Store, Ads</text><text x="630" y="162" class="muted" text-anchor="middle">each skipped when already registered</text><rect width="200" height="100" x="780" y="100" class="box" rx="4"/><text x="880" y="122" class="title" text-anchor="middle">register()</text><text x="880" y="138" class="muted" text-anchor="middle">dashboard name pattern</text><text x="880" y="154" class="muted" text-anchor="middle">id is namespaced</text><text x="880" y="170" class="muted" text-anchor="middle">id not registered</text><text x="880" y="186" class="muted" text-anchor="middle">else _doing_it_wrong(), false</text><rect width="240" height="56" x="510" y="220" class="box-muted" rx="4"/><text x="630" y="236" class="title" text-anchor="middle">a plugin</text><text x="630" y="252" class="mono" text-anchor="middle">register_dashboard_section( … )</text><text x="630" y="268" class="muted" text-anchor="middle">once the API file is loaded</text><polyline marker-end="url(#arrow)" points="220 142 250 142" class="edge"/><polyline marker-end="url(#arrow)" points="480 142 510 142" class="edge"/><polyline marker-end="url(#arrow)" points="750 142 780 142" class="edge"/><polyline marker-end="url(#arrow)" points="750 248 880 248 880 200" class="edge"/></svg>